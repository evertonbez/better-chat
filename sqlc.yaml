version: "2"
sql:
  - engine: postgresql
    schema: "data/sql/migrations"
    queries: "data/sql/queries"
    gen:
      go:
        package: "dbstore"
        out: "go/gen/dbstore"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
        emit_empty_slices: true
